# Despliegue de seguridad. Los servicios se incluyen cuando están implementados.
# Ejecutar con --env-file example.security.env; el experimento anterior se
# conserva en docker-compose.disponibilidad.yaml.
name: ${STACK:?falta STACK}

include:
  - queue-service/docker-compose.security.yaml

networks:
  data-control:
    name: ${STACK}_data_control
    internal: true
  data-negocio:
    name: ${STACK}_data_negocio
    internal: true
