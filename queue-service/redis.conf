# "Queue server" del diagrama de despliegue: único puente entre el plano de
# control (validacion, auditor, reaccion) y el plano de negocio
# (gestion-polizas, gestion-cotizador).
#
# Ida:      XADD sol:{polizas|cotizador}  +  un consumer group por stream
# Vuelta:   LPUSH resp:{correlation_id}   +  BLPOP desde Validación
# Eventos:  XADD auditoria (negocio -> auditor), XADD seguridad (validacion -> reaccion)

# --- Red ---------------------------------------------------------------------
# Escucha en todas las interfaces del contenedor. Es seguro porque el servicio
# vive solo en redes `internal: true` y sin puertos publicados: nada fuera del
# stack puede alcanzarlo. El acceso para depurar es `docker compose exec`.
bind 0.0.0.0
protected-mode no

# --- Persistencia ------------------------------------------------------------
# AOF y no snapshots: un evento de seguridad perdido invalida el experimento, y
# un snapshot cada N segundos deja una ventana de pérdida que el AOF no tiene.
appendonly yes
appendfsync everysec
save ""
dir /data

# --- Memoria -----------------------------------------------------------------
# Nunca desalojar. Si Redis se llena, las escrituras deben FALLAR de forma
# visible para que el productor aplique contrapresión; descartar en silencio un
# evento de auditoría o de seguridad dejaría un incidente sin detectar.
maxmemory-policy noeviction

# --- Latencia ----------------------------------------------------------------
# Redis revisa los clientes bloqueados en su tarea periódica, a `hz` veces por
# segundo. Con el valor por defecto (10) un BLPOP tarda hasta ~100 ms de más en
# vencer; con 100 la resolución baja a ~10 ms. Importa para medir con precisión
# la latencia de revocación.
hz 100

# --- Observabilidad ----------------------------------------------------------
loglevel notice
