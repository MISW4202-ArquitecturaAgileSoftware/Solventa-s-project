# "Queue server" del diagrama de despliegue: difusión desacoplada de solicitudes
# hacia las tres réplicas del cotizador y recolección de sus respuestas.
#
# Ida:    XADD cot:req  +  un consumer group por réplica  -> fan-out real
# Vuelta: LPUSH cot:resp:{correlation_id}  +  BLPOP desde Votación

# --- Red ---------------------------------------------------------------------
# Escucha en todas las interfaces del contenedor. Es seguro porque el servicio
# vive solo en la red `data`, declarada `internal: true` y sin puertos
# publicados: nada fuera del stack puede alcanzarlo. El acceso para depurar es
# `docker compose exec`.
bind 0.0.0.0
protected-mode no

# --- Persistencia ------------------------------------------------------------
# AOF y no snapshots: una cotización perdida invalida el experimento, y un
# snapshot cada N segundos deja una ventana de pérdida que el AOF no tiene.
appendonly yes
appendfsync everysec
save ""
dir /data

# --- Memoria -----------------------------------------------------------------
# Nunca desalojar. Si Redis se llena, las escrituras deben FALLAR de forma
# visible para que el productor aplique contrapresión; descartar silenciosamente
# un evento de cotización es exactamente lo que ASR-18 prohíbe.
# El límite `maxmemory` se fijará al montar la prueba de pico de ASR-18: antes
# de eso solo introduciría un modo de fallo que nadie está midiendo.
maxmemory-policy noeviction

# --- Latencia ----------------------------------------------------------------
# Redis revisa los clientes bloqueados en su tarea periódica, a `hz` veces por
# segundo. Con el valor por defecto (10) la resolución de un timeout de BLPOP es
# de ~100 ms, así que la ventana de gracia de 25 ms de Votación tardaba 105 ms
# en vencer. Con 100 la resolución baja a ~10 ms. Cuesta algo más de CPU en
# tareas de fondo, y aquí ese gasto compra margen directo sobre el presupuesto
# de ASR-12.
hz 100

# --- Observabilidad ----------------------------------------------------------
loglevel notice
