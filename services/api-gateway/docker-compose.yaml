# api-gateway: única puerta pública. Enruta hacia autenticacion y validacion;
# no tiene lógica de negocio ni de seguridad propia.

services:
  api-gateway:
    image: solventa/api-gateway:${TAG:?falta TAG en .env}
    build:
      context: .
      dockerfile: Dockerfile
      # Solo el build: pip necesita el DNS del host. Runtime sigue en edge/backend.
      network: host
    restart: unless-stopped
    networks:
      # edge: única zona con salida al exterior. api-gateway es el ÚNICO
      # servicio presente aquí.
      - edge
      # backend: llama a autenticacion y a validacion.
      - backend
    ports:
      - "${PUERTO_GATEWAY:?falta PUERTO_GATEWAY en .env}:8000"
    environment:
      URL_AUTENTICACION: ${URL_AUTENTICACION:?falta URL_AUTENTICACION en .env}
      URL_VALIDACION: ${URL_VALIDACION:?falta URL_VALIDACION en .env}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      autenticacion:
        condition: service_started
      validacion:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  edge:
    name: ${STACK:?falta STACK en .env}_edge
  backend:
    name: ${STACK:?falta STACK en .env}_backend
    internal: true
