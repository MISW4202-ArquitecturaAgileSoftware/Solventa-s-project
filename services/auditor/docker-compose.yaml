# Auditor: worker puro (sin Flask ni gunicorn) que cada PERIODO_AUDITORIA_S lee
# el stream `auditoria`, compara la región de cada consulta con el historial
# del empleado e informa las regiones nuevas a Validación. Corazón de ASR-31.

services:
  auditor:
    image: solventa/auditor:${TAG:?falta TAG en .env}
    build:
      context: .
      dockerfile: Dockerfile
      # Solo el build: pip necesita el DNS del host. Runtime sigue aislado.
      network: host
    restart: unless-stopped
    networks:
      # backend: informa anomalías a Validación por HTTP.
      - backend
      # data-control: lee el stream `auditoria`. No alcanza a los workers de
      # negocio ni publica en `sol:*`.
      - data-control
    volumes:
      - auditor-data:/data
    environment:
      REDIS_URL: ${REDIS_URL:?falta REDIS_URL en .env}
      STREAM_AUDITORIA: ${STREAM_AUDITORIA:-auditoria}
      GRUPO: auditor
      # Fijo a propósito: los eventos no confirmados son pendientes de ESTE
      # consumidor; con el hostname quedarían huérfanos al recrear el contenedor.
      CONSUMIDOR: auditor-1
      PERIODO_AUDITORIA_S: ${PERIODO_AUDITORIA_S:-5}
      URL_VALIDACION: ${URL_VALIDACION:?falta URL_VALIDACION en .env}
      TIMEOUT_HTTP_MS: ${TIMEOUT_HTTP_MS:-2000}
      RUTA_DB: /data/auditor.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      validacion:
        # Solo "arrancado": si Validación aún no responde, el evento queda
        # pendiente y se reintenta en el ciclo siguiente.
        condition: service_started

networks:
  backend:
    name: ${STACK:?falta STACK en .env}_backend
    internal: true
  data-control:
    name: ${STACK:?falta STACK en .env}_data_control
    internal: true

volumes:
  auditor-data:
    name: ${STACK:?falta STACK en .env}_auditor_data
