# Auditor: detección a posteriori de consultas fuera del alcance habitual (ASR-31).

services:
  auditor:
    image: solventa/auditor:${TAG:?falta TAG en .env}
    build:
      context: .
      dockerfile: Dockerfile
      # Solo el build: pip necesita el DNS del host. Runtime sigue en backend/data-control.
      network: host
    restart: unless-stopped
    networks:
      # backend: llama por HTTP a Validación.
      - backend
      # data-control: lee el stream `auditoria` de Redis.
      - data-control
    volumes:
      - auditor-data:/data
    environment:
      REDIS_URL: ${REDIS_URL:?falta REDIS_URL en .env}
      STREAM_AUDITORIA: ${STREAM_AUDITORIA:?falta STREAM_AUDITORIA en .env}
      URL_VALIDACION: ${URL_VALIDACION:?falta URL_VALIDACION en .env}
      PERIODO_AUDITORIA_S: ${PERIODO_AUDITORIA_S:-5}
      RUTA_DB: /data/auditor.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      validacion:
        condition: service_started

networks:
  backend:
    name: ${STACK:?falta STACK en .env}_backend
    internal: true
  data-control:
    name: ${STACK:?falta STACK en .env}_data_control
    internal: true

volumes:
  auditor-data:
    name: ${STACK:?falta STACK en .env}_auditor_data
