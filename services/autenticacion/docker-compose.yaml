# Autenticación: emite y verifica sesiones; ejecuta la revocación y el bloqueo.

services:
  autenticacion:
    image: solventa/autenticacion:${TAG:?falta TAG en .env}
    build:
      context: .
      dockerfile: Dockerfile
      # Solo el build: pip necesita el DNS del host. Runtime sigue en backend/ops.
      network: host
    restart: unless-stopped
    networks:
      # backend: recibe del gateway y de validacion (Reacción).
      - backend
      # ops: solo para validar fases y para que el experimento altere roles.
      - ops
    ports:
      - "${PUERTO_AUTENTICACION:?falta PUERTO_AUTENTICACION en .env}:8000"
    volumes:
      - autenticacion-data:/data
    environment:
      RUTA_DB: /data/autenticacion.db
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      JWT_TTL_S: ${JWT_TTL_S:-3600}
      MODO_EXPERIMENTO: ${MODO_EXPERIMENTO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  backend:
    name: ${STACK:?falta STACK en .env}_backend
    internal: true
  ops:
    name: ${STACK:?falta STACK en .env}_ops

volumes:
  autenticacion-data:
    name: ${STACK:?falta STACK en .env}_autenticacion_data
