# GestorErrores: destino de la flecha `Votacion -> GestorErrores` del diagrama.

services:
  gestion-errores:
    image: solventa/gestion-errores:${TAG:?falta TAG en .env}
    build:
      # Contexto = raíz del repositorio: la imagen necesita libs/solventa-common.
      context: ../..
      dockerfile: services/gestion-errores/Dockerfile
    restart: unless-stopped
    networks:
      # backend: por donde lo llama Votación.
      - backend
      # ops: solo para que el host pueda leer /v1/metricas al medir. Un
      # servicio conectado únicamente a redes `internal: true` no puede
      # publicar puertos, y sin publicarlos no habría cómo medir ASR-11.
      - ops
    ports:
      - "${PUERTO_GESTION_ERRORES:?falta PUERTO_GESTION_ERRORES en .env}:8000"
    volumes:
      # La evidencia del experimento sobrevive al contenedor.
      - incidentes:/datos
    environment:
      RUTA_INCIDENTES: /datos/incidentes.jsonl
      CAPACIDAD_COLA: ${CAPACIDAD_COLA:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  backend:
    name: ${STACK:?falta STACK en .env}_backend
    internal: true
  ops:
    name: ${STACK:?falta STACK en .env}_ops

volumes:
  incidentes:
    name: ${STACK:?falta STACK en .env}_incidentes
